# Created by trellis-cli v1.19.0
# Documentation: https://roots.io/trellis/docs/wordpress-sites/

wordpress_sites:
  featherdash.io:
    site_hosts:
      - canonical: featherdash.io
    local_path: ..
    public_path: public
    upload_path: content/uploads
    branch: main
    repo: git@github.com:digital-brew/featherdash-web.git
    multisite:
      enabled: false
    # Vito issues and renews the certificate; enabled here so WP_HOME/WP_SITEURL use https.
    ssl:
      enabled: true
      provider: manual
    cache:
      enabled: false
    # The database and its user are created in Vito (Databases); the password is in vault.yml.
    env:
      db_name: featherdash_prod
      db_user: featherdash_prod
      db_prefix: dbio_
